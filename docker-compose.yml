services:
  mysql:
    image: mysql:8.4
    container_name: food-search-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: food_search
      MYSQL_USER: food_search
      MYSQL_PASSWORD: food_search
    ports:
      # Host port 3307 avoids clashing with a local MySQL on 3306.
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
